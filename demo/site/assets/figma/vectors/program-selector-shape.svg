<!-- The hero Programs widget silhouette, taken verbatim from union.svg.
     One shape, not a tab rectangle stacked on a panel rectangle: the two
     meet through 18px concave fillets, and those are what make the joint
     read as a smooth S instead of a right angled step. Used as a CSS mask
     so the gradient stays a CSS token and scales with the design unit.

     Keep double hyphens out of this comment: they are illegal inside an
     XML comment, and a malformed mask silently masks the element away. -->
